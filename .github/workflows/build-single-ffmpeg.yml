name: Build Single FFmpeg Binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-26
          - os: windows
            arch: x86_64
            runner: windows-2022

    env:
      FFMPEG_VERSION: "8.0.1"
      PROFILE: "profiles/default.yml"

    steps:
      - uses: actions/checkout@v4

      # ---------- macOS Build ----------
      - name: Bootstrap (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/bootstrap-macos.sh

      # Patch libsvtav1 (use Python, not sed, for BSD compatibility)
      - name: Patch libsvtav1 for SVT-AV1 4.x (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p .build-cache/src
          cd .build-cache/src
          if [ ! -d "ffmpeg-${FFMPEG_VERSION}" ]; then
            curl -L -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
            tar xf ffmpeg.tar.xz
          fi
          cd ffmpeg-${FFMPEG_VERSION}
          python3 - <<'PY'
          import sys
          path = "libavcodec/libsvtav1.c"
          src = open(path, "r", encoding="utf-8").read()
          old = "param->enable_adaptive_quantization = 0;"
          new = (
              "#if SVT_AV1_CHECK_VERSION(4, 0, 0)\n"
              "        param->aq_mode = 0;\n"
              "#else\n"
              "        param->enable_adaptive_quantization = 0;\n"
              "#endif"
          )
          if new in src:
              print("Already patched")
          elif old not in src:
              sys.exit("ERROR: target line not found")
          else:
              open(path, "w", encoding="utf-8").write(src.replace(old, new, 1))
              print("Patched libsvtav1.c")
          PY

      - name: Build FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/build-ffmpeg.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/package.sh

      # Extract ffmpeg from the zip created by package.sh
      - name: Extract ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ZIP=$(find dist -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no zip found in dist/"
            ls -la dist/ || true
            exit 1
          fi
          unzip -o "$ZIP" -d extracted
          FFMPEG_BIN=$(find extracted -name "ffmpeg" -type f | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg not found in zip"
            exit 1
          fi
          cp "$FFMPEG_BIN" ./ffmpeg-macos-arm64
          chmod +x ./ffmpeg-macos-arm64
          ./ffmpeg-macos-arm64 -version

      # ---------- Windows Build ----------
      - name: Bootstrap toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git nasm yasm cmake ninja zip
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x264 mingw-w64-x86_64-x265
            mingw-w64-x86_64-aom mingw-w64-x86_64-opus mingw-w64-x86_64-libvpx

      - name: Patch libsvtav1 for SVT-AV1 4.x (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p .build-cache/src
          cd .build-cache/src
          if [ ! -d "ffmpeg-${FFMPEG_VERSION}" ]; then
            curl -L -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
            tar xf ffmpeg.tar.xz
          fi
          cd ffmpeg-${FFMPEG_VERSION}
          python - <<'PY'
          import sys
          path = "libavcodec/libsvtav1.c"
          src = open(path, "r", encoding="utf-8").read()
          old = "param->enable_adaptive_quantization = 0;"
          new = (
              "#if SVT_AV1_CHECK_VERSION(4, 0, 0)\n"
              "        param->aq_mode = 0;\n"
              "#else\n"
              "        param->enable_adaptive_quantization = 0;\n"
              "#endif"
          )
          if new in src:
              print("Already patched")
          elif old not in src:
              sys.exit("ERROR: target line not found")
          else:
              open(path, "w", encoding="utf-8").write(src.replace(old, new, 1))
              print("Patched libsvtav1.c")
          PY

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg-windows.sh

      # CRITICAL: run the official packaging script to produce the zip in dist/
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/package-windows.sh

      # Extract ffmpeg.exe from the zip instead of guessing the build output path
      - name: Extract ffmpeg.exe (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ZIP=$(find dist -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no zip found in dist/"
            ls -la dist/ || true
            exit 1
          fi
          unzip -o "$ZIP" -d extracted
          FFMPEG_BIN=$(find extracted -name "ffmpeg.exe" -type f | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg.exe not found in zip"
            exit 1
          fi
          cp "$FFMPEG_BIN" ./ffmpeg-windows-x86_64.exe
          ./ffmpeg-windows-x86_64.exe -version

      # ---------- Upload Artifacts ----------
      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ./ffmpeg-macos-arm64

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: ./ffmpeg-windows-x86_64.exe

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p ./final-assets
          find ./release-assets -type f \( -name "ffmpeg-macos-arm64" -o -name "ffmpeg-windows-x86_64.exe" \) -exec cp {} ./final-assets/ \;
          ls -la ./final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./final-assets/ffmpeg-macos-arm64
            ./final-assets/ffmpeg-windows-x86_64.exe
          generate_release_notes: true
