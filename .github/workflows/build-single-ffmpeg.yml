name: Build Single FFmpeg Binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-26
          - os: windows
            arch: x86_64
            runner: windows-2022

    env:
      FFMPEG_VERSION: "8.0.1"
      PROFILE: "profiles/default.yml"

    steps:
      - uses: actions/checkout@v4

      # ---------- macOS Build ----------
      - name: Bootstrap (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/bootstrap-macos.sh

      # Key step: Patch FFmpeg source code before building to adapt to SVT-AV1 4.x
      - name: Patch libsvtav1 for SVT-AV1 4.x (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # ffmpeg-builder will download the source code to .build-cache/src/ during the build script
          # Here we modify after the build script downloads the source code but before compilation
          # Since the build script doesn't expose a hook, we first let it download the source code (build will fail), then patch
          # A more elegant approach is to manually download the source code, but this is the simplest modification
          # Actually, ffmpeg-builder's build-ffmpeg.sh downloads and compiles internally
          # We use a workaround: first download the source code to the expected location, then patch
          mkdir -p .build-cache/src
          cd .build-cache/src
          if [ ! -d "ffmpeg-${FFMPEG_VERSION}" ]; then
            curl -L -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
            tar xf ffmpeg.tar.xz
          fi
          cd ffmpeg-${FFMPEG_VERSION}
          # Apply the official fix: wrap with version check
          sed -i 's/param->enable_adaptive_quantization = 0;/#if SVT_AV1_CHECK_VERSION(4, 0, 0)\n        param->aq_mode = 0;\n#else\n        param->enable_adaptive_quantization = 0;\n#endif/' libavcodec/libsvtav1.c
          echo "Patched libsvtav1.c:"
          grep -A 3 "aq_mode" libavcodec/libsvtav1.c

      - name: Build FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/build-ffmpeg.sh

      - name: Locate and copy binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          FFMPEG_BIN=$(find out -name "ffmpeg" -type f | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg binary not found"
            exit 1
          fi
          cp "$FFMPEG_BIN" ./ffmpeg-macos-arm64
          chmod +x ./ffmpeg-macos-arm64
          ./ffmpeg-macos-arm64 -version

      # ---------- Windows Build ----------
      - name: Bootstrap toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git nasm yasm cmake ninja zip
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x264 mingw-w64-x86_64-x265
            mingw-w64-x86_64-aom mingw-w64-x86_64-opus mingw-w64-x86_64-libvpx

      - name: Patch libsvtav1 for SVT-AV1 4.x (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p .build-cache/src
          cd .build-cache/src
          if [ ! -d "ffmpeg-${FFMPEG_VERSION}" ]; then
            curl -L -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
            tar xf ffmpeg.tar.xz
          fi
          cd ffmpeg-${FFMPEG_VERSION}
          sed -i 's/param->enable_adaptive_quantization = 0;/#if SVT_AV1_CHECK_VERSION(4, 0, 0)\n        param->aq_mode = 0;\n#else\n        param->enable_adaptive_quantization = 0;\n#endif/' libavcodec/libsvtav1.c
          echo "Patched libsvtav1.c:"
          grep -A 3 "aq_mode" libavcodec/libsvtav1.c

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg-windows.sh

      - name: Locate and copy binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          FFMPEG_BIN=$(find out -name "ffmpeg.exe" -type f | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg.exe not found"
            exit 1
          fi
          cp "$FFMPEG_BIN" ./ffmpeg-windows-x86_64.exe

      # ---------- Upload Artifacts ----------
      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ./ffmpeg-macos-arm64

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: ./ffmpeg-windows-x86_64.exe

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p ./final-assets
          find ./release-assets -type f \( -name "ffmpeg-macos-arm64" -o -name "ffmpeg-windows-x86_64.exe" \) -exec cp {} ./final-assets/ \;
          ls -la ./final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./final-assets/ffmpeg-macos-arm64
            ./final-assets/ffmpeg-windows-x86_64.exe
          generate_release_notes: true
