name: Build Single FFmpeg Binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-26
          - os: windows
            arch: x86_64
            runner: windows-2022

    env:
      # 强制使用 8.0.1 版本
      FFMPEG_VERSION: "8.0.1"
      # 使用 default profile（包含 libx264 等常用编码器）
      PROFILE: "profiles/default.yml"

    steps:
      - uses: actions/checkout@v4

      # ---------- macOS 构建 ----------
      - name: Bootstrap (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/bootstrap-macos.sh

      - name: Build FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/build-ffmpeg.sh

      # macOS 的产物在 out/ 目录下，具体路径取决于 triplet
      # ffmpeg-builder 通常输出到 out/<triplet>/bin/ffmpeg
      - name: Locate and copy binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # 找到 ffmpeg 可执行文件
          FFMPEG_BIN=$(find out -name "ffmpeg" -type f | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg binary not found"
            exit 1
          fi
          cp "$FFMPEG_BIN" ./ffmpeg-macos-arm64
          chmod +x ./ffmpeg-macos-arm64
          ./ffmpeg-macos-arm64 -version

      # ---------- Windows 构建 ----------
      - name: Bootstrap toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git nasm yasm cmake ninja zip
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x264 mingw-w64-x86_64-x265
            mingw-w64-x86_64-aom mingw-w64-x86_64-opus mingw-w64-x86_64-libvpx

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg-windows.sh

      - name: Locate and copy binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # ffmpeg-builder 的 Windows 构建脚本通常将产物放在 out/ 下
          FFMPEG_BIN=$(find out -name "ffmpeg.exe" -type f | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg.exe not found"
            exit 1
          fi
          cp "$FFMPEG_BIN" ./ffmpeg-windows-x86_64.exe

      # ---------- 上传构建产物（用于非 Release 场景的检查） ----------
      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ./ffmpeg-macos-arm64

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: ./ffmpeg-windows-x86_64.exe

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      # 将下载的产物整理到同一目录，方便 softprops 上传
      - name: Flatten artifacts
        run: |
          mkdir -p ./final-assets
          find ./release-assets -type f \( -name "ffmpeg-macos-arm64" -o -name "ffmpeg-windows-x86_64.exe" \) -exec cp {} ./final-assets/ \;
          ls -la ./final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./final-assets/ffmpeg-macos-arm64
            ./final-assets/ffmpeg-windows-x86_64.exe
          generate_release_notes: true
